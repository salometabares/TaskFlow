
events {
    worker_connections 1024;
}

http {

    upstream taskflow_backends {
        server backend1:5000;
        server backend2:5000;
        server backend3:5000;
    }

    server {
        listen 80;

        # Mostrar el frontend al entrar a la raiz
        location = / {
            proxy_pass http://taskflow_backends/app;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Estadisticas para Nginx Prometheus Exporter
        location = /stub_status {
            stub_status;
            allow all;
        }

        # Resto de rutas de la aplicacion y API
        location / {
            proxy_pass http://taskflow_backends;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
